server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les en-têtes de sécurité sont posés par le middleware Traefik, pas ici :
    # une seule source de vérité, versionnée avec le reste du cluster.

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Astro empreinte les noms sous /_astro/ : le contenu ne change jamais
    # pour une URL donnée.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Les polices gardent un nom stable : cache long mais révocable.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
